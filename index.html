<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Israa — دليل زيارات الدكاترة</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Cairo:wght@400;500;600;700&display=swap');

  :root{
    --bg:#EEF3FB;
    --surface:#FFFFFF;
    --surface-alt:#F4F8FD;
    --ink:#152238;
    --ink-soft:#5A6C8A;
    --line:#D7E2F2;
    --primary:#2856A6;
    --primary-dark:#1A3B79;
    --primary-soft:#E1EAF9;
    --accent:#2E8FC0;
    --accent-soft:#DFF1F8;
    --danger:#B23A34;
    --danger-soft:#F7E5E3;
    --radius:14px;
    --shadow: 0 2px 10px rgba(21,34,56,0.07), 0 1px 2px rgba(21,34,56,0.05);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:880px;margin:0 auto;padding:20px 16px 80px;}

  /* Header */
  header.app-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding:22px 22px;
    background:linear-gradient(135deg,var(--primary) 0%, var(--primary-dark) 100%);
    border-radius:var(--radius);
    color:#fff;
    box-shadow:var(--shadow);
    margin-bottom:18px;
  }
  .app-head .pin-badge{
    width:48px;height:48px;flex:none;border-radius:50%;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
  }
  .app-head .pin-badge svg{width:24px;height:24px;fill:#fff;}
  .app-head h1{font-family:'Tajawal',sans-serif;font-weight:900;font-size:24px;margin:0;letter-spacing:0.3px;}
  .app-head p{margin:4px 0 0;font-size:13px;opacity:0.85;font-weight:500;}
  .stats-line{
    margin-inline-start:auto;
    text-align:left;
    font-family:'Tajawal',sans-serif;
    font-size:13px;
    background:rgba(255,255,255,0.15);
    padding:8px 14px;
    border-radius:20px;
    font-weight:700;
    white-space:nowrap;
  }
  @media (max-width:560px){
    header.app-head{flex-wrap:wrap;}
    .stats-line{margin-inline-start:0;order:3;width:100%;text-align:center;}
  }

  /* Tabs */
  nav.tabs{
    display:flex;
    gap:8px;
    background:var(--surface-alt);
    padding:6px;
    border-radius:12px;
    border:1px solid var(--line);
    margin-bottom:20px;
  }
  nav.tabs button{
    flex:1;
    border:none;
    background:transparent;
    padding:11px 8px;
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    font-size:14.5px;
    color:var(--ink-soft);
    border-radius:9px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  nav.tabs button:hover{color:var(--ink);}
  nav.tabs button.active{
    background:var(--surface);
    color:var(--primary-dark);
    box-shadow:var(--shadow);
  }

  .panel{display:none; animation:fadeIn .25s ease;}
  .panel.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  h2.section-title{
    font-family:'Tajawal',sans-serif;
    font-size:18px;
    font-weight:800;
    margin:0 0 14px;
    color:var(--ink);
  }

  /* Search */
  .search-box{
    position:relative;
    margin-bottom:18px;
  }
  .search-box svg{
    position:absolute;
    inset-inline-start:14px;
    top:50%;
    transform:translateY(-50%);
    width:18px;height:18px;
    fill:var(--ink-soft);
  }
  .search-box input{
    width:100%;
    padding:12px 42px 12px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface);
    font-family:'Cairo',sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  .search-box input:focus{outline:2px solid var(--primary); outline-offset:1px;}

  /* Route list */
  .route-list{position:relative; padding-inline-start:0;}
  .route-stop{position:relative; padding-inline-end:52px; margin-bottom:22px;}
  .route-stop:not(:last-child)::after{
    content:'';
    position:absolute;
    inset-inline-end:19px;
    top:42px;
    bottom:-22px;
    width:2px;
    background:var(--primary-soft);
  }
  .stop-badge{
    position:absolute;
    inset-inline-end:0;
    top:0;
    width:40px;height:40px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Tajawal',sans-serif;
    font-weight:800;
    font-size:15px;
    box-shadow:0 2px 5px rgba(46,143,192,0.4);
    flex:none;
  }
  .stop-badge.unclassified{background:var(--ink-soft); box-shadow:none;}
  .stop-head{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding-top:6px;
    margin-bottom:10px;
  }
  .stop-head h3{font-family:'Tajawal',sans-serif;font-size:16.5px;font-weight:800;margin:0;}
  .stop-head span.count{font-size:12.5px;color:var(--ink-soft);font-weight:600;}

  .icon-btn{
    width:30px;height:30px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface-alt);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s ease;
  }
  .icon-btn svg{width:15px;height:15px;fill:var(--ink-soft);}
  .icon-btn:hover{background:var(--primary-soft);}
  .icon-btn.danger:hover{background:var(--danger-soft);}
  .icon-btn.danger:hover svg{fill:var(--danger);}

  /* Doctors table */
  .table-scroll{
    overflow-x:auto;
    border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    background:var(--surface);
  }
  table.doctor-table{width:100%; border-collapse:collapse; min-width:640px;}
  .doctor-table thead th{
    background:var(--primary-soft);
    color:var(--primary-dark);
    font-family:'Tajawal',sans-serif;
    font-weight:800;
    font-size:12.5px;
    text-align:right;
    padding:11px 13px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  .doctor-table tbody td{
    padding:11px 13px;
    font-size:13.5px;
    color:var(--ink);
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  .doctor-table tbody tr:last-child td{border-bottom:none;}
  .doctor-table tbody tr:hover td{background:var(--surface-alt);}
  .doctor-table td.name-cell{font-family:'Tajawal',sans-serif; font-weight:800; white-space:nowrap;}
  .doctor-table td.notes-cell{color:var(--ink-soft); max-width:220px;}
  .doctor-table a.phone-link{
    color:var(--primary-dark); font-weight:700; text-decoration:none; white-space:nowrap;
    display:inline-flex; align-items:center; gap:5px;
  }
  .doctor-table a.phone-link svg{width:13px;height:13px;fill:var(--primary-dark);}
  .doctor-table td.actions-cell{white-space:nowrap;}
  .doctor-table td.actions-cell .card-actions{display:flex; gap:6px;}
  .cell-dash{color:var(--line);}

  .empty-msg{
    background:var(--surface-alt);
    border:1px dashed var(--line);
    border-radius:12px;
    padding:14px 16px;
    color:var(--ink-soft);
    font-size:13.5px;
  }

  .big-empty{
    text-align:center;
    padding:50px 20px;
    background:var(--surface);
    border-radius:var(--radius);
    border:1px solid var(--line);
  }
  .big-empty svg{width:46px;height:46px;fill:var(--line); margin-bottom:12px;}
  .big-empty p{color:var(--ink-soft); font-size:14px; margin:0 0 16px;}

  /* Forms */
  .form-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:var(--shadow);
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:13.5px;
    font-weight:700;
    margin-bottom:6px;
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
  }
  .field .hint{font-weight:500; color:var(--ink-soft); font-size:12px;}
  .field input, .field select, .field textarea{
    width:100%;
    padding:11px 13px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--surface-alt);
    font-family:'Cairo',sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:64px;}
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--primary); outline-offset:1px; background:var(--surface);
  }
  .field-row{display:flex; gap:12px;}
  .field-row .field{flex:1;}
  @media (max-width:560px){.field-row{flex-direction:column; gap:0;}}

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:11px 20px;
    border-radius:10px;
    border:none;
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--surface-alt);}
  .btn-danger-ghost{background:transparent; color:var(--danger); border:1px solid var(--danger-soft);}
  .btn-danger-ghost:hover{background:var(--danger-soft);}
  .form-actions{display:flex; gap:10px; margin-top:4px;}
  .edit-banner{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--accent-soft); color:var(--primary-dark); border-radius:9px;
    padding:10px 14px; margin-bottom:16px; font-size:13.5px; font-weight:700;
  }

  /* Areas tab */
  .add-area-form{display:flex; gap:10px; margin-bottom:20px;}
  .add-area-form input{flex:1;}
  .area-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 14px;
    margin-bottom:9px;
  }
  .area-row .order-no{
    width:26px;height:26px;border-radius:50%;
    background:var(--primary-soft); color:var(--primary-dark);
    display:flex;align-items:center;justify-content:center;
    font-family:'Tajawal',sans-serif; font-weight:800; font-size:12.5px; flex:none;
  }
  .area-row .name{flex:1; font-weight:700; font-size:14.5px;}
  .area-row .sub{font-size:12px; color:var(--ink-soft); font-weight:500;}
  .area-row .reorder-btns{display:flex; flex-direction:column; gap:2px;}
  .area-row .reorder-btns button{
    width:22px;height:18px; border:none; background:var(--surface-alt);
    border-radius:4px; cursor:pointer; display:flex;align-items:center;justify-content:center;
  }
  .area-row .reorder-btns svg{width:10px;height:10px; fill:var(--ink-soft);}

  .settings-box{
    margin-top:26px; padding-top:18px; border-top:1px dashed var(--line);
  }
  .settings-box p{font-size:12.5px; color:var(--ink-soft); margin:0 0 10px;}

  /* Toast */
  #toast-wrap{
    position:fixed; bottom:20px; right:50%; transform:translateX(50%);
    z-index:999; display:flex; flex-direction:column; gap:8px; align-items:center;
  }
  .toast{
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:30px;
    font-size:13.5px; font-weight:600; box-shadow:0 4px 14px rgba(0,0,0,0.2);
    animation:toastIn .2s ease;
  }
  @keyframes toastIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

  #loading-screen{
    display:flex; align-items:center; justify-content:center; min-height:60vh;
    flex-direction:column; gap:12px; color:var(--ink-soft); font-size:14px;
  }
  .spinner{
    width:30px;height:30px;border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--primary);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #main-content{display:none;}

  .app-footer{
    text-align:center;
    margin-top:36px;
    padding-top:16px;
    border-top:1px solid var(--line);
    color:var(--ink-soft);
    font-size:12.5px;
    font-family:'Cairo',sans-serif;
  }
  .app-footer .heart{color:var(--danger); margin:0 3px; font-size:13px;}
</style>
</head>
<body>

<div class="wrap">
  <div id="loading-screen">
    <div class="spinner"></div>
    <div>بنجهزلك البيانات...</div>
  </div>

  <div id="main-content">
    <header class="app-head">
      <div class="pin-badge">
        <svg viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.6 4 10c0 5.4 7 11.5 7.3 11.8.2.1.4.2.7.2s.5-.1.7-.2C13 21.5 20 15.4 20 10c0-4.4-3.6-8-8-8zm0 11c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3z"/></svg>
      </div>
      <div>
        <h1>Israa</h1>
        <p>دليل زيارات الدكاترة بترتيب المناطق</p>
      </div>
      <div class="stats-line" id="statsLine">0 منطقة · 0 دكتور</div>
    </header>

    <nav class="tabs">
      <button data-tab="route" class="active">الدكاترة</button>
      <button data-tab="add">ضيف دكتور</button>
      <button data-tab="areas">المناطق</button>
    </nav>

    <!-- ROUTE / VIEW TAB -->
    <section class="panel active" id="panel-route">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19l-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
        <input type="text" id="searchInput" placeholder="دور باسم الدكتور، رقمه، أو عنوانه...">
      </div>
      <div id="routeContainer"></div>
    </section>

    <!-- ADD DOCTOR TAB -->
    <section class="panel" id="panel-add">
      <h2 class="section-title">بيانات الدكتور</h2>
      <div class="form-card">
        <div id="editBanner" class="edit-banner" style="display:none;">
          <span>بتعدل بيانات دكتور موجود</span>
          <button type="button" class="btn btn-ghost" id="cancelEditBtn" style="padding:5px 12px;font-size:12.5px;">إلغاء</button>
        </div>
        <form id="doctorForm">
          <div class="field">
            <label>اسم الدكتور</label>
            <input type="text" id="docName" placeholder="مثال: د. أحمد سمير" required>
          </div>
          <div class="field-row">
            <div class="field">
              <label>المنطقة</label>
              <select id="docArea" required></select>
            </div>
            <div class="field">
              <label>رقم التليفون <span class="hint">(اختياري)</span></label>
              <input type="tel" id="docPhone" placeholder="01xxxxxxxxx">
            </div>
          </div>
          <div class="field">
            <label>العنوان <span class="hint">(اختياري)</span></label>
            <textarea id="docAddress" placeholder="اسم العيادة، الشارع، علامة مميزة..."></textarea>
          </div>
          <div class="field">
            <label>المواعيد المتاحة <span class="hint">(اختياري)</span></label>
            <input type="text" id="docTimes" placeholder="مثال: من 5 لـ 8 بعد العصر، ما عدا الجمعة">
          </div>
          <div class="field">
            <label>ملاحظات إضافية <span class="hint">(اختياري)</span></label>
            <textarea id="docNotes" placeholder="أي حاجة تحب تفتكرها عن الدكتور ده..."></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submitDocBtn">حفظ الدكتور</button>
          </div>
        </form>
      </div>
    </section>

    <!-- AREAS TAB -->
    <section class="panel" id="panel-areas">
      <h2 class="section-title">المناطق الجغرافية</h2>
      <form class="add-area-form" id="areaForm">
        <input type="text" id="areaNameInput" placeholder="اسم منطقة جديدة، مثال: السكة الجديدة">
        <button type="submit" class="btn btn-primary">إضافة</button>
      </form>
      <div id="areasListContainer"></div>
      <div class="settings-box">
        <p>ترتيب المناطق هنا هو اللي بيحدد ترتيب ظهورهم في شاشة "الدكاترة".</p>
        <button type="button" class="btn btn-danger-ghost" id="resetAllBtn">مسح كل البيانات</button>
      </div>
    </section>

    <footer class="app-footer">Made with <span class="heart">♥</span> by Youssef</footer>
  </div>
</div>

<div id="toast-wrap"></div>
<script type="module">
  // استدعاء مكتبات فايربيز
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  // ⚠️ حط بيانات مشروعك اللي أخدتها من فايربيز هنا

const firebaseConfig = {
  apiKey: "AIzaSyC0nIkeCvKqGWggs59FEpvKrorNhjk35_w",
  authDomain: "israa-app-18357.firebaseapp.com",
  projectId: "israa-app-18357",
  storageBucket: "israa-app-18357.firebasestorage.app",
  messagingSenderId: "836830301295",
  appId: "1:836830301295:web:5560911cc49d8e6268119a",
  measurementId: "G-0ECLHX51KK"
};

  // تهيئة قاعدة البيانات
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ---------- Icons ----------
  const ICONS = {
    phone:'<svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1L6.6 10.8z"/></svg>',
    pin:'<svg viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.6 4 10c0 5.4 7 11.5 7.3 11.8.2.1.4.2.7.2s.5-.1.7-.2C13 21.5 20 15.4 20 10c0-4.4-3.6-8-8-8zm0 11c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3z"/></svg>',
    clock:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 10.6l4.2 2.5-.7 1.2-5-3V6.5h1.5v6.1z"/></svg>',
    note:'<svg viewBox="0 0 24 24"><path d="M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm2 5h12v2H6V8zm0 4h12v2H6v-2zm0 4h8v2H6v-2z"/></svg>',
    edit:'<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>',
    trash:'<svg viewBox="0 0 24 24"><path d="M6 7h12l-1 14H7L6 7zm3-4h6l1 2h4v2H4V5h4l1-2zm0 6h2v9H9v-9zm4 0h2v9h-2v-9z"/></svg>',
    search:'<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19l-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>',
    up:'<svg viewBox="0 0 24 24"><path d="M12 6l7 8h-4v6h-6v-6H5z"/></svg>',
    down:'<svg viewBox="0 0 24 24"><path d="M12 18l-7-8h4V4h6v6h4z"/></svg>',
    mapEmpty:'<svg viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.6 4 10c0 5.4 7 11.5 7.3 11.8.2.1.4.2.7.2s.5-.1.7-.2C13 21.5 20 15.4 20 10c0-4.4-3.6-8-8-8zm0 11c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3z"/></svg>'
  };

  // ---------- State ----------
  let areas = [];
  let doctors = [];
  let editingId = null;

  // ---------- Helpers ----------
  function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function esc(str){
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }
  function showToast(msg){
    const wrap = document.getElementById('toast-wrap');
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2200);
  }

  // ---------- Storage (Firebase Cloud) ----------
  async function loadAll(){
    try{
      const docRef = doc(db, "israa_app", "main_data");
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        const data = docSnap.data();
        areas = data.areas || [];
        doctors = data.doctors || [];
      } else {
        areas = []; doctors = [];
      }
    }catch(e){ console.error(e); areas = []; doctors = []; }
  }

  async function syncToCloud(){
    try{
      await setDoc(doc(db, "israa_app", "main_data"), { areas, doctors });
    }catch(e){ 
      console.error(e); 
      showToast('حصل خطأ في حفظ البيانات على السحابة'); 
    }
  }

  async function saveAreas(){ await syncToCloud(); }
  async function saveDoctors(){ await syncToCloud(); }

  // ---------- Render Functions ----------
  function renderStats(){ document.getElementById('statsLine').textContent = `${areas.length} منطقة · ${doctors.length} دكتور`; }

  function renderAreaSelect(){
    const sel = document.getElementById('docArea');
    const current = sel.value;
    if(areas.length === 0){
      sel.innerHTML = '<option value="">لسه مفيش مناطق مضافة</option>';
      sel.disabled = true;
      return;
    }
    sel.disabled = false;
    sel.innerHTML = '<option value="" disabled>اختار المنطقة</option>' +
      areas.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');
    if(current) sel.value = current;
  }

  function renderRoute(){
    const container = document.getElementById('routeContainer');
    const query = document.getElementById('searchInput').value.trim().toLowerCase();

    if(areas.length === 0){
      container.innerHTML = `
        <div class="big-empty">
          ${ICONS.mapEmpty}
          <p>لسه مفيش مناطق مضافة. ابدأ بإضافة أول منطقة عشان تقدر تسجل الدكاترة.</p>
          <button class="btn btn-primary" id="goToAreasBtn">روح لتبويب المناطق</button>
        </div>`;
      const btn = document.getElementById('goToAreasBtn');
      if(btn) btn.addEventListener('click', () => document.querySelector('nav.tabs button[data-tab="areas"]').click());
      return;
    }

    function matches(doc){
      if(!query) return true;
      return (doc.name||'').toLowerCase().includes(query) ||
             (doc.phone||'').toLowerCase().includes(query) ||
             (doc.address||'').toLowerCase().includes(query);
    }

    let html = '<div class="route-list">';
    let anyShown = false;

    areas.forEach((area, idx) => {
      const areaDocs = doctors.filter(d => d.areaId === area.id && matches(d));
      if(query && areaDocs.length === 0) return;
      anyShown = true;
      html += `<div class="route-stop">
        <div class="stop-badge">${idx+1}</div>
        <div class="stop-head"><h3>${esc(area.name)}</h3><span class="count">(${areaDocs.length} دكتور)</span></div>`;
      if(areaDocs.length === 0){
        html += `<div class="empty-msg">لسه مفيش دكاترة في المنطقة دي. ضيف واحد من تبويب "ضيف دكتور".</div>`;
      }else{
        html += doctorsTableHtml(areaDocs);
      }
      html += `</div>`;
    });

    const unclassified = doctors.filter(d => !areas.some(a => a.id === d.areaId) && matches(d));
    if(unclassified.length){
      anyShown = true;
      html += `<div class="route-stop">
        <div class="stop-badge unclassified">؟</div>
        <div class="stop-head"><h3>دكاترة من غير منطقة محددة</h3><span class="count">(${unclassified.length})</span></div>`;
      html += doctorsTableHtml(unclassified);
      html += `</div>`;
    }

    html += '</div>';

    if(!anyShown){ html = `<div class="big-empty"><p>مفيش نتائج مطابقة للبحث.</p></div>`; }
    
    if(doctors.length === 0 && !query){
      container.innerHTML = `<div class="big-empty">
          ${ICONS.mapEmpty}
          <p>لسه مفيش دكاترة مسجلين. يلا نبدأ بإضافة أول دكتور.</p>
          <button class="btn btn-primary" id="goToAddBtn">ضيف دكتور</button>
        </div>`;
      const btn2 = document.getElementById('goToAddBtn');
      if(btn2) btn2.addEventListener('click', () => document.querySelector('nav.tabs button[data-tab="add"]').click());
      return;
    }
    
    if(anyShown) { container.innerHTML = html; }
  }

  function doctorsTableHtml(list){
    const rows = list.map(doc => {
      const phone = doc.phone ? `<a class="phone-link" href="tel:${esc(doc.phone)}">${ICONS.phone}${esc(doc.phone)}</a>` : `<span class="cell-dash">—</span>`;
      const address = doc.address ? esc(doc.address) : `<span class="cell-dash">—</span>`;
      const times = doc.availableTimes ? esc(doc.availableTimes) : `<span class="cell-dash">—</span>`;
      const notes = doc.notes ? esc(doc.notes) : `<span class="cell-dash">—</span>`;
      return `<tr>
        <td class="name-cell">${esc(doc.name)}</td>
        <td>${phone}</td>
        <td>${address}</td>
        <td>${times}</td>
        <td class="notes-cell">${notes}</td>
        <td class="actions-cell">
          <div class="card-actions">
            <button class="icon-btn" data-action="edit-doctor" data-id="${esc(doc.id)}" title="تعديل">${ICONS.edit}</button>
            <button class="icon-btn danger" data-action="delete-doctor" data-id="${esc(doc.id)}" title="حذف">${ICONS.trash}</button>
          </div>
        </td>
      </tr>`;
    }).join('');
    return `<div class="table-scroll">
      <table class="doctor-table">
        <thead>
          <tr>
            <th>الاسم</th>
            <th>التليفون</th>
            <th>العنوان</th>
            <th>المواعيد</th>
            <th>ملاحظات</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }

  function renderAreasTab(){
    const container = document.getElementById('areasListContainer');
    if(areas.length === 0){
      container.innerHTML = `<div class="empty-msg">لسه مفيش مناطق. ضيف أول منطقة من الفورم اللي فوق.</div>`;
      return;
    }
    container.innerHTML = areas.map((a, idx) => {
      const count = doctors.filter(d => d.areaId === a.id).length;
      return `<div class="area-row">
        <div class="order-no">${idx+1}</div>
        <div style="flex:1;">
          <div class="name">${esc(a.name)}</div>
          <div class="sub">${count} دكتور مسجل</div>
        </div>
        <div class="reorder-btns">
          <button data-action="area-up" data-id="${esc(a.id)}" ${idx===0?'disabled':''} title="حرك لفوق">${ICONS.up}</button>
          <button data-action="area-down" data-id="${esc(a.id)}" ${idx===areas.length-1?'disabled':''} title="حرك لتحت">${ICONS.down}</button>
        </div>
        <button class="icon-btn" data-action="rename-area" data-id="${esc(a.id)}" title="تعديل الاسم">${ICONS.edit}</button>
        <button class="icon-btn danger" data-action="delete-area" data-id="${esc(a.id)}" title="حذف">${ICONS.trash}</button>
      </div>`;
    }).join('');
  }

  function renderAll(){
    renderStats();
    renderAreaSelect();
    renderRoute();
    renderAreasTab();
  }

  // ---------- UI Events ----------
  document.querySelectorAll('nav.tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  document.getElementById('searchInput').addEventListener('input', renderRoute);

  const doctorForm = document.getElementById('doctorForm');
  const editBanner = document.getElementById('editBanner');
  const submitDocBtn = document.getElementById('submitDocBtn');

  function resetDoctorForm(){
    doctorForm.reset();
    editingId = null;
    editBanner.style.display = 'none';
    submitDocBtn.textContent = 'حفظ الدكتور';
  }
  document.getElementById('cancelEditBtn').addEventListener('click', resetDoctorForm);

  doctorForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('docName').value.trim();
    const areaId = document.getElementById('docArea').value;
    const phone = document.getElementById('docPhone').value.trim();
    const address = document.getElementById('docAddress').value.trim();
    const availableTimes = document.getElementById('docTimes').value.trim();
    const notes = document.getElementById('docNotes').value.trim();

    if(!name){ showToast('لازم تدخل اسم الدكتور'); return; }
    if(!areaId){ showToast('لازم تختار المنطقة'); return; }

    if(editingId){
      const docItem = doctors.find(d => d.id === editingId);
      if(docItem) Object.assign(docItem, { name, areaId, phone, address, availableTimes, notes });
      await saveDoctors();
      showToast('تم تحديث بيانات الدكتور');
      resetDoctorForm();
      renderAll();
      document.querySelector('nav.tabs button[data-tab="route"]').click();
    }else{
      doctors.push({ id: uid('doc'), name, areaId, phone, address, availableTimes, notes });
      await saveDoctors();
      showToast('تم إضافة الدكتور بنجاح');
      resetDoctorForm();
      renderAll();
      document.getElementById('docName').focus();
    }
  });

  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;

    if(action === 'edit-doctor'){
      const docItem = doctors.find(d => d.id === id);
      if(!docItem) return;
      editingId = id;
      document.getElementById('docName').value = docItem.name || '';
      document.getElementById('docArea').value = docItem.areaId || '';
      document.getElementById('docPhone').value = docItem.phone || '';
      document.getElementById('docAddress').value = docItem.address || '';
      document.getElementById('docTimes').value = docItem.availableTimes || '';
      document.getElementById('docNotes').value = docItem.notes || '';
      editBanner.style.display = 'flex';
      submitDocBtn.textContent = 'تحديث البيانات';
      document.querySelector('nav.tabs button[data-tab="add"]').click();
      window.scrollTo({top:0, behavior:'smooth'});
    }

    if(action === 'delete-doctor'){
      const docItem = doctors.find(d => d.id === id);
      if(!docItem) return;
      if(confirm(`متأكد إنك عايز تمسح "${docItem.name}"؟`)){
        doctors = doctors.filter(d => d.id !== id);
        await saveDoctors();
        showToast('تم حذف الدكتور');
        renderAll();
      }
    }

    if(action === 'area-up' || action === 'area-down'){
      const idx = areas.findIndex(a => a.id === id);
      const swapWith = action === 'area-up' ? idx - 1 : idx + 1;
      if(swapWith < 0 || swapWith >= areas.length) return;
      [areas[idx], areas[swapWith]] = [areas[swapWith], areas[idx]];
      await saveAreas();
      renderAll();
    }

    if(action === 'rename-area'){
      const area = areas.find(a => a.id === id);
      if(!area) return;
      const newName = prompt('اسم المنطقة:', area.name);
      if(newName && newName.trim()){
        area.name = newName.trim();
        await saveAreas();
        renderAll();
        showToast('تم تعديل اسم المنطقة');
      }
    }

    if(action === 'delete-area'){
      const area = areas.find(a => a.id === id);
      if(!area) return;
      const count = doctors.filter(d => d.areaId === id).length;
      const msg = count > 0
        ? `المنطقة دي فيها ${count} دكتور. لو مسحتها هيبقوا من غير منطقة محددة. متأكد؟`
        : `متأكد إنك عايز تمسح منطقة "${area.name}"؟`;
      if(confirm(msg)){
        areas = areas.filter(a => a.id !== id);
        await saveAreas();
        await saveDoctors();
        showToast('تم حذف المنطقة');
        renderAll();
      }
    }
  });

  document.getElementById('areaForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('areaNameInput');
    const name = input.value.trim();
    if(!name){ showToast('اكتب اسم المنطقة الأول'); return; }
    if(areas.some(a => a.name.toLowerCase() === name.toLowerCase())){
      showToast('المنطقة دي موجودة بالفعل');
      return;
    }
    areas.push({ id: uid('area'), name });
    await saveAreas();
    input.value = '';
    showToast('تم إضافة المنطقة');
    renderAll();
  });

  document.getElementById('resetAllBtn').addEventListener('click', async () => {
    if(confirm('هيتم مسح كل المناطق والدكاترة نهائيًا. متأكد؟')){
      areas = []; doctors = [];
      await saveAreas(); await saveDoctors();
      showToast('تم مسح كل البيانات');
      renderAll();
    }
  });

  // ---------- Init ----------
  (async function init(){
    await loadAll();
    renderAll();
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
  })();
</script>
</body>
</html>
